<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Dashboard Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1A2030" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    
    <!-- Tech Gradient for Lines -->
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    
    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Stronger Glow for Core -->
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Plate -->
  <rect x="0" y="0" width="100" height="100" rx="16" fill="url(#bgGrad)" />

  <!-- Outer System Ring (Subtle dashed orbit) -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3 5" opacity="0.6"/>

  <!-- Intersecting Network Orbits (The 'Eye/Lens' Shape) -->
  <g fill="none" stroke="url(#traceGrad)" filter="url(#softGlow)">
    <!-- Primary Inner Orbits -->
    <ellipse cx="50" cy="50" rx="32" ry="14" stroke-width="2" transform="rotate(45 50 50)" />
    <ellipse cx="50" cy="50" rx="32" ry="14" stroke-width="2" transform="rotate(-45 50 50)" />
    
    <!-- Secondary Outer Orbits (for depth) -->
    <ellipse cx="50" cy="50" rx="42" ry="20" stroke-width="1" opacity="0.4" transform="rotate(45 50 50)" />
    <ellipse cx="50" cy="50" rx="42" ry="20" stroke-width="1" opacity="0.4" transform="rotate(-45 50 50)" />
  </g>

  <!-- Structural Connecting Lines (Neural Network vibes) -->
  <g stroke="#3B82F6" stroke-width="1.5" opacity="0.6">
    <line x1="50" y1="50" x2="15" y2="15" />
    <line x1="50" y1="50" x2="85" y2="15" />
    <line x1="50" y1="50" x2="15" y2="85" />
    <line x1="50" y1="50" x2="85" y2="85" />
  </g>

  <!-- Network Nodes -->
  <g filter="url(#softGlow)">
    <!-- Primary Corner Nodes (Cyan) -->
    <circle cx="15" cy="15" r="4" fill="#00F0FF" />
    <circle cx="85" cy="15" r="4" fill="#00F0FF" />
    <circle cx="15" cy="85" r="4" fill="#00F0FF" />
    <circle cx="85" cy="85" r="4" fill="#00F0FF" />
  </g>
  
  <!-- Secondary Mid-Point Nodes (Blue) -->
  <g>
    <circle cx="50" cy="15" r="2.5" fill="#3B82F6" />
    <circle cx="50" cy="85" r="2.5" fill="#3B82F6" />
    <circle cx="15" cy="50" r="2.5" fill="#3B82F6" />
    <circle cx="85" cy="50" r="2.5" fill="#3B82F6" />
  </g>

  <!-- Central AI Core / Target Eye -->
  <g filter="url(#coreGlow)">
    <!-- Outer Reticle Ring -->
    <circle cx="50" cy="50" r="9" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8" />
    <!-- Glowing Core -->
    <circle cx="50" cy="50" r="5" fill="url(#traceGrad)" />
    <!-- Center Pinpoint -->
    <circle cx="50" cy="50" r="1.5" fill="#FFFFFF" />
  </g>
</svg>